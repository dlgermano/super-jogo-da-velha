<style>
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: estúdio de TV — palco central com a pergunta, escada de prêmios à direita (vira faixa no celular) */
:root {
  color-scheme: dark;
  --stage: #070f33;
  --stage-2: #0d1a52;
  --panel: #13256e;
  --panel-hi: #1c3596;
  --line: #2c4ab8;
  --gold: #f6c744;
  --gold-deep: #c7921a;
  --ink: #eef1ff;
  --ink-dim: #a9b4e3;
  --ok: #2fbf71;
  --bad: #e5484d;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--stage-2) 0%, var(--stage) 60%) fixed, var(--stage);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  padding-inline: 16px;
  padding-block: 20px 40px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button:disabled { cursor: not-allowed; }

.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) 240px; align-items: start; }
header.top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--display); font-weight: 900; font-size: clamp(28px, 5vw, 44px); line-height: 1; letter-spacing: .02em; text-transform: uppercase; }
.logo span { color: var(--gold); }
.record { font-size: 13px; color: var(--ink-dim); letter-spacing: .06em; text-transform: uppercase; }
.record b { color: var(--gold); font-variant-numeric: tabular-nums; }

main { display: grid; gap: 16px; min-width: 0; }

/* Valores da rodada */
.stakes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stake { background: var(--stage-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-align: center; }
.stake small { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.stake strong { font-family: var(--display); font-size: clamp(20px, 3.4vw, 28px); font-variant-numeric: tabular-nums; }
.stake.win strong { color: var(--gold); }
.stake.lose strong { color: #ff9a9d; }

/* Pergunta */
.qbox { background: linear-gradient(180deg, var(--panel-hi), var(--panel)); border: 2px solid var(--gold-deep); border-radius: 18px; padding: 22px 22px 24px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.qmeta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 800; }
.qtext { font-size: clamp(19px, 2.6vw, 24px); font-weight: 800; line-height: 1.35; margin: 12px 0 0; text-wrap: balance; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--stage-2); border: 2px solid var(--line); border-radius: 999px;
  padding: 12px 18px 12px 12px; min-height: 58px; font-weight: 600; font-size: 16px;
  transition: background .15s, border-color .15s, transform .1s;
}
.opt:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-1px); }
.opt .l { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: var(--stage); font-family: var(--display); font-weight: 900; font-size: 20px; }
.opt span:last-child { min-width: 0; }
.opt.sel { background: var(--gold); color: var(--stage); border-color: var(--gold); }
.opt.sel .l { background: var(--stage); color: var(--gold); }
.opt.ok { background: var(--ok); border-color: var(--ok); color: #04210f; animation: pulse .5s 3; }
.opt.ok .l { background: #04210f; color: var(--ok); }
.opt.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt.gone { opacity: .18; text-decoration: line-through; }
@keyframes pulse { 50% { transform: scale(1.03); } }

/* Barra de ações */
.bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; background: var(--stage-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.bar p { margin: 0; font-weight: 800; font-size: 17px; }
.bar .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border-radius: 10px; padding: 10px 18px; font-weight: 800; border: 2px solid var(--line); background: var(--panel); }
.btn.primary { background: var(--gold); color: var(--stage); border-color: var(--gold); }
.btn.ghost { background: transparent; }
.btn:hover:not(:disabled) { filter: brightness(1.12); }

/* Ajudas */
.help { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.aid { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 10px 6px; display: grid; gap: 2px; justify-items: center; }
.aid b { font-family: var(--display); font-size: 20px; letter-spacing: .03em; text-transform: uppercase; }
.aid small { font-size: 11px; color: var(--ink-dim); }
.aid:hover:not(:disabled) { border-color: var(--gold); }
.aid:disabled { opacity: .35; }

.result { background: var(--stage-2); border: 1px dashed var(--gold-deep); border-radius: 14px; padding: 14px 16px; }
.result h3 { margin: 0 0 10px; font-family: var(--display); font-size: 20px; letter-spacing: .04em; text-transform: uppercase; color: var(--gold); }
.result p { margin: 4px 0; }
.cards { display: flex; gap: 10px; flex-wrap: wrap; }
.card { width: 64px; height: 90px; border-radius: 8px; border: 2px solid var(--gold); background: repeating-linear-gradient(45deg, var(--panel) 0 6px, var(--panel-hi) 6px 12px); font-family: var(--display); font-size: 30px; font-weight: 900; }
.card.face { background: var(--ink); color: var(--bad); }
.votes { display: grid; gap: 6px; }
.vote { display: grid; grid-template-columns: 22px 1fr 44px; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.vote .track { height: 14px; background: var(--stage); border-radius: 7px; overflow: hidden; }
.vote .fill { height: 100%; background: var(--gold); border-radius: 7px; transition: width .8s ease-out; }

/* Escada */
aside { background: var(--stage-2); border: 1px solid var(--line); border-radius: 16px; padding: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
aside h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); text-align: center; }
.ladder { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column-reverse; gap: 3px; }
.ladder li { display: flex; justify-content: space-between; padding: 4px 10px; border-radius: 6px; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink-dim); }
.ladder li .n { opacity: .7; }
.ladder li.done { color: var(--ink); }
.ladder li.cur { background: var(--gold); color: var(--stage); font-weight: 800; }
.ladder li.mark { border-top: 1px solid var(--line); }
.ladder li.top { font-family: var(--display); font-size: 18px; color: var(--gold); }
.ladder li.top.cur { color: var(--stage); }

/* Fim de jogo */
.end { text-align: center; padding: 34px 20px; }
.end .big { font-family: var(--display); font-weight: 900; font-size: clamp(44px, 9vw, 84px); color: var(--gold); line-height: 1; font-variant-numeric: tabular-nums; }
.end p { color: var(--ink-dim); max-width: 46ch; margin: 12px auto 20px; }

@media (max-width: 760px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; order: -1; padding: 10px; }
  .ladder { flex-direction: row; overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px; }
  .ladder li { flex: none; flex-direction: column; align-items: center; padding: 4px 8px; font-size: 12px; }
  .ladder li.mark { border-top: 0; border-left: 1px solid var(--line); }
  .opts { grid-template-columns: 1fr; }
  .help { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

    ["Qual é o elemento químico mais abundante no universo?", ["Hidrogênio","Hélio","Oxigênio","Carbono"]],
  ],
  4: [
    ["Quem demonstrou o Último Teorema de Fermat, em 1994?", ["Andrew Wiles","Grigori Perelman","Carl Friedrich Gauss","Leonhard Euler"]],

    ["Em que ano o primeiro astronauta brasileiro foi ao espaço?", ["2006","1998","2001","2012"]],
    ["Quantos elementos químicos a tabela periódica reconhece oficialmente?", ["118","112","120","108"]],
    ["Qual país foi o primeiro a dar às mulheres o direito de votar em eleições nacionais, em 1893?", ["Nova Zelândia","Finlândia","Austrália","Noruega"]],
    ["Quantos corações tem um polvo?", ["3","1","2","4"]],
    ["Qual é a capital do Cazaquistão?", ["Astana","Almaty","Tashkent","Bishkek"]],
    ["Qual é a capital do Butão?", ["Thimphu","Katmandu","Daca","Paro"]],
    ["Em que ano foi fundada a cidade de São Paulo?", ["1554","1565","1532","1600"]],
    ["Em que ano foi fundada a cidade do Rio de Janeiro?", ["1565","1554","1502","1567"]],
    ["Qual partícula transmite a força eletromagnética?", ["Fóton","Glúon","Bóson W","Gráviton"]],
    ["Qual é o valor aproximado da constante de Avogadro?", ["6,02 × 10²³","3,00 × 10⁸","9,81","1,60 × 10⁻¹⁹"]],
    ["Em que cidade foram julgados os líderes nazistas depois da Segunda Guerra?", ["Nuremberg","Haia","Versalhes","Genebra"]],
    ["Quem pintou “Moça com Brinco de Pérola”?", ["Johannes Vermeer","Rembrandt","Frans Hals","Jan van Eyck"]],
    ["Qual foi o primeiro satélite artificial, lançado em 1957?", ["Sputnik 1","Explorer 1","Vostok 1","Telstar"]],
    ["Qual é o rio mais longo da Europa?", ["Volga","Danúbio","Reno","Dniepre"]],
    ["Qual é a profundidade aproximada da Fossa das Marianas?", ["Cerca de 11 km","Cerca de 5 km","Cerca de 20 km","Cerca de 2 km"]],
    ["Quem foi o primeiro imperador de Roma?", ["Augusto","Júlio César","Nero","Calígula"]],
    ["Quantas teclas tem um piano padrão?", ["88","76","96","84"]],
    ["Que cientista brasileiro descreveu a doença de Chagas, em 1909?", ["Carlos Chagas","Oswaldo Cruz","Adolfo Lutz","Vital Brazil"]],
    ["Qual é a unidade de carga elétrica no Sistema Internacional?", ["Coulomb","Ampere","Volt","Joule"]],
    ["Qual dinastia governava a China quando Marco Polo esteve lá?", ["Yuan","Ming","Qing","Han"]],
  ],
};

const STUDENTS = [["Ana","Medicina"],["Bruno","Engenharia"],["Carla","Direito"]];
const ACC = {1: .9, 2: .75, 3: .6, 4: .45};
const CROWD = {1: .72, 2: .55, 3: .42, 4: .32};
const LETTERS = ["A","B","C","D"];

const $ = (id) => document.getElementById(id);
const money = (v) => v.toLocaleString("pt-BR", {style: "currency", currency: "BRL", maximumFractionDigits: 0});
const levelOf = (i) => i < 5 ? 1 : i < 10 ? 2 : i < 15 ? 3 : 4;
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];

let S;
let record = 0;
try { record = Number(localStorage.getItem("sdm-record")) || 0; } catch (e) {}

function newGame() {
  S = { idx: 0, used: {1: [], 2: [], 3: [], 4: []}, skips: 3, aids: {cartas: false, placas: false, univ: false},
        q: null, gone: [], sel: null, phase: "ask", help: null, end: null };
  draw();
  render();
}

// Perguntas já vistas ficam guardadas entre partidas, para não repetir até esgotar o nível
let seen = [];
try { seen = JSON.parse(localStorage.getItem("sdm-seen")) || []; } catch (e) {}
const saveSeen = () => { try { localStorage.setItem("sdm-seen", JSON.stringify(seen)); } catch (e) {} };

function draw() {
  const lv = levelOf(S.idx);
  const fresh = (q) => !S.used[lv].includes(q[0]);
  let pool = BANK[lv].filter((q) => fresh(q) && !seen.includes(q[0]));
  if (!pool.length) {
    const texts = BANK[lv].map((q) => q[0]);
    seen = seen.filter((t) => !texts.includes(t));
    pool = BANK[lv].filter(fresh);
  }
  if (!pool.length) { S.used[lv] = []; pool = BANK[lv]; }
  const [text, opts] = pick(pool);
  S.used[lv].push(text);
  seen.push(text);
  saveSeen();
  const order = shuffle([0, 1, 2, 3]);
  S.q = { text, opts: order.map((o) => opts[o]), ans: order.indexOf(0) };
  S.gone = []; S.sel = null; S.phase = "ask"; S.help = null;
}

const stakes = () => {
  const have = S.idx ? PRIZES[S.idx - 1] : 0;
  return { win: PRIZES[S.idx], stop: have, lose: S.idx === 15 ? 0 : Math.floor(have / 2) };
};

function finish(amount, kind) {
  S.phase = "end";
  S.end = { amount, kind };
  if (amount > record) { record = amount; try { localStorage.setItem("sdm-record", String(record)); } catch (e) {} }
  render();
}

function choose(i) { if (S.phase !== "ask" && S.phase !== "confirm") return; S.sel = i; S.phase = "confirm"; render(); }

function confirmAnswer() {
  S.phase = "wait"; render();
  setTimeout(() => {
    const right = S.sel === S.q.ans;
    S.phase = right ? "right" : "wrong";
    render();
  }, 1400);
}

function next() {
  if (S.phase === "right") {
    if (S.idx === 15) return finish(1000000, "milhao");
    S.idx++; draw(); render();
  } else if (S.phase === "wrong") {
    finish(stakes().lose, "errou");
  }
}

function skip() { if (S.skips && S.phase === "ask") { S.skips--; draw(); render(); } }

function useCartas() {
  if (S.aids.cartas || S.phase !== "ask") return;
  S.aids.cartas = true;
  S.help = { type: "cartas", deck: shuffle(["K","A","2","3"]), open: null };
  render();
}
function flipCard(i) {
  const h = S.help; if (!h || h.open !== null) return;
  h.open = i;
  const n = {K: 0, A: 1, "2": 2, "3": 3}[h.deck[i]];
  S.gone = shuffle([0,1,2,3].filter((x) => x !== S.q.ans)).slice(0, n);
  h.n = n;
  render();
}

function usePlacas() {
  if (S.aids.placas || S.phase !== "ask") return;
  S.aids.placas = true;
  const lv = levelOf(S.idx);
  const alive = [0,1,2,3].filter((x) => !S.gone.includes(x));
  const w = alive.map((x) => x === S.q.ans ? CROWD[lv] * 100 + Math.random() * 15 : Math.random() * 30 + 5);
  const tot = w.reduce((a, b) => a + b, 0);
  const pct = [0,0,0,0];
  alive.forEach((x, k) => pct[x] = Math.round(w[k] / tot * 100));
  const diff = 100 - pct.reduce((a, b) => a + b, 0); pct[alive[0]] += diff;
  S.help = { type: "placas", pct };
  render();
}

function useUniv() {
  if (S.aids.univ || S.phase !== "ask") return;
  S.aids.univ = true;
  const lv = levelOf(S.idx);
  const wrongs = [0,1,2,3].filter((x) => x !== S.q.ans && !S.gone.includes(x));
  const said = STUDENTS.map(([name, course]) => {
    const ok = Math.random() < ACC[lv] || !wrongs.length;
    const sure = ok ? Math.random() < .6 : Math.random() < .3;
    return { name, course, guess: ok ? S.q.ans : pick(wrongs), sure };
  });
  S.help = { type: "univ", said };
  render();
}

function renderLadder() {
  $("ladder").innerHTML = PRIZES.map((p, i) => {
    const cls = [i < S.idx || (S.phase === "end" && S.end.kind === "milhao") ? "done" : "", i === S.idx && S.phase !== "end" ? "cur" : "", i === 5 || i === 10 || i === 15 ? "mark" : "", i === 15 ? "top" : ""].join(" ");
    return `<li class="${cls}"><span class="n">${i + 1}</span><span>${money(p)}</span></li>`;
  }).join("");
  const cur = $("ladder").querySelector(".cur");
  if (cur && window.matchMedia("(max-width: 760px)").matches) cur.scrollIntoView({ block: "nearest", inline: "center" });
  $("record").textContent = money(record);
}

function renderHelp() {
  const h = S.help; if (!h) return "";
  if (h.type === "cartas") {
    const cards = h.deck.map((c, i) => `<button class="card ${h.open === i ? "face" : ""}" data-card="${i}" ${h.open !== null ? "disabled" : ""} aria-label="Carta ${i + 1}">${h.open === i ? c : ""}</button>`).join("");
    const msg = h.open === null ? "<p>Escolha uma carta. Rei não tira nenhuma, Ás tira uma, 2 tira duas e 3 tira três alternativas erradas.</p>"
      : `<p>${h.n === 0 ? "Que azar! Saiu o Rei, nenhuma alternativa foi eliminada." : `Saiu o ${h.deck[h.open] === "A" ? "Ás" : h.deck[h.open]}: ${h.n} alternativa${h.n > 1 ? "s" : ""} errada${h.n > 1 ? "s" : ""} eliminada${h.n > 1 ? "s" : ""}.`}</p>`;
    return `<div class="result"><h3>Cartas</h3><div class="cards">${cards}</div>${msg}</div>`;
  }
  if (h.type === "placas") {
    return `<div class="result"><h3>A plateia votou</h3><div class="votes">${h.pct.map((p, i) => `<div class="vote"><b>${LETTERS[i]}</b><div class="track"><div class="fill" style="width:${p}%"></div></div><span>${p}%</span></div>`).join("")}</div></div>`;
  }
  if (h.type === "univ") {
    return `<div class="result"><h3>Os universitários</h3>${h.said.map((s) => `<p><b>${s.name}</b> (${s.course}): ${s.sure ? "Tenho certeza, é a" : "Acho que é a"} <b>${LETTERS[s.guess]}</b>.</p>`).join("")}</div>`;
  }
  return "";
}

function render() {
  renderLadder();
  const m = $("main");
  if (S.phase === "end") {
    const e = S.end;
    const title = e.kind === "milhao" ? "Você é milionário!" : e.kind === "parou" ? "Você parou" : "Que pena, você errou";
    const text = e.kind === "milhao" ? "Acertou as 16 perguntas e levou o prêmio máximo."
      : e.kind === "parou" ? `Parou na pergunta ${S.idx + 1} e levou o que tinha acumulado.`
      : `A resposta certa era a ${LETTERS[S.q.ans]}: ${S.q.opts[S.q.ans]}. Você leva metade do que tinha acumulado.`;
    m.innerHTML = `<section class="qbox end"><div class="qmeta" style="justify-content:center">${title}</div><div class="big">${money(e.amount)}</div><p>${text}</p><button class="btn primary" id="again">Jogar de novo</button></section>`;
    $("again").onclick = newGame;
    return;
  }

  const st = stakes();
  const lv = levelOf(S.idx);
  const reveal = S.phase === "right" || S.phase === "wrong";
  const opts = S.q.opts.map((o, i) => {
    let c = "";
    if (S.gone.includes(i)) c = "gone";
    if (S.sel === i) c = "sel";
    if (reveal && i === S.q.ans) c = "ok";
    else if (reveal && i === S.sel) c = "bad";
    const dis = S.gone.includes(i) || !(S.phase === "ask" || S.phase === "confirm");
    return `<button class="opt ${c}" data-opt="${i}" ${dis ? "disabled" : ""}><span class="l">${LETTERS[i]}</span><span>${o}</span></button>`;
  }).join("");

  let bar;
  if (S.phase === "ask") bar = `<p>Escolha uma alternativa.</p><div class="btns"><button class="btn ghost" id="stop" ${S.idx === 0 ? "disabled" : ""}>Parar e levar ${money(st.stop)}</button></div>`;
  else if (S.phase === "confirm") bar = `<p>Está certo disso? Posso perguntar?</p><div class="btns"><button class="btn ghost" id="back">Não, quero trocar</button><button class="btn primary" id="yes">Sim, estou certo</button></div>`;
  else if (S.phase === "wait") bar = `<p>Vamos ver se você acertou…</p>`;
  else if (S.phase === "right") bar = `<p>Certa resposta! Você ganhou ${money(st.win)}.</p><div class="btns"><button class="btn primary" id="next">${S.idx === 15 ? "Receber o milhão" : "Próxima pergunta"}</button></div>`;
  else bar = `<p>Que pena, resposta errada.</p><div class="btns"><button class="btn primary" id="next">Ver resultado</button></div>`;

  const canAid = S.phase === "ask";
  m.innerHTML = `
    <div class="stakes">
      <div class="stake lose"><small>Errar</small><strong>${money(st.lose)}</strong></div>
      <div class="stake"><small>Parar</small><strong>${money(st.stop)}</strong></div>
      <div class="stake win"><small>Acertar</small><strong>${money(st.win)}</strong></div>
    </div>
    <section class="qbox">
      <div class="qmeta"><span>Pergunta ${S.idx + 1} de 16</span><span>${LEVEL_NAME[lv]}</span></div>
      <p class="qtext">${S.q.text}</p>
    </section>
    <div class="opts">${opts}</div>
    <div class="bar">${bar}</div>
    ${renderHelp()}
    <div class="help">
      <button class="aid" id="a-skip" ${!S.skips || !canAid ? "disabled" : ""}><b>Pular</b><small>${S.skips} restante${S.skips === 1 ? "" : "s"}</small></button>
      <button class="aid" id="a-cartas" ${S.aids.cartas || !canAid ? "disabled" : ""}><b>Cartas</b><small>elimina de 0 a 3</small></button>
      <button class="aid" id="a-placas" ${S.aids.placas || !canAid ? "disabled" : ""}><b>Placas</b><small>voto da plateia</small></button>
      <button class="aid" id="a-univ" ${S.aids.univ || !canAid ? "disabled" : ""}><b>Universitários</b><small>três palpites</small></button>
    </div>`;

  m.querySelectorAll("[data-opt]").forEach((b) => b.onclick = () => choose(+b.dataset.opt));
  m.querySelectorAll("[data-card]").forEach((b) => b.onclick = () => flipCard(+b.dataset.card));
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("stop", () => finish(st.stop, "parou"));
  on("back", () => { S.sel = null; S.phase = "ask"; render(); });
  on("yes", confirmAnswer);
  on("next", next);
  on("a-skip", skip);
  on("a-cartas", useCartas);
  on("a-placas", usePlacas);
  on("a-univ", useUniv);
}

window.claude?.hot?.snapshot?.(() => S);
const start = (data) => {
  if (data && data.q) { S = data; if (S.phase === "wait") S.phase = "confirm"; render(); }
  else newGame();
};
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
